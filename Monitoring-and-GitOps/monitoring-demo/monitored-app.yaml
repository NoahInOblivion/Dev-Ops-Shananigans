apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitored-app
  namespace: default
  labels:
    app: monitored-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitored-app
  template:
    metadata:
      labels:
        app: monitored-app
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitored-app-svc
  namespace: default
  labels:
    app: monitored-app
spec:
  type: ClusterIP
  selector:
    app: monitored-app
  ports:
  - port: 80
    targetPort: 80
    name: http
