apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-workload
  namespace: default
  labels:
    app: gitops-workload
    managed-by: gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-workload
  template:
    metadata:
      labels:
        app: gitops-workload
    spec:
      containers:
      - name: web
        image: nginx:1.24-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-workload-svc
  namespace: default
  labels:
    app: gitops-workload
    managed-by: gitops
spec:
  type: ClusterIP
  selector:
    app: gitops-workload
  ports:
  - port: 80
    targetPort: 80
