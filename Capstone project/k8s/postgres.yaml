apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: taskboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: taskboard}
            - {name: POSTGRES_USER, value: taskboard}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: taskboard-db, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, taskboard]}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: taskboard}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
