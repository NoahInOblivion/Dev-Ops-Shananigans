apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-frontend}
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector: {matchLabels: {app: taskboard-frontend}}
  template:
    metadata: {labels: {app: taskboard-frontend}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
          resources: {{- toYaml .Values.resources.frontend | nindent 12}}
---
apiVersion: v1
kind: Service
metadata: {name: taskboard-frontend}
spec:
  selector: {app: taskboard-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
