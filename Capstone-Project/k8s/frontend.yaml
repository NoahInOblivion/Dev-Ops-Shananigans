apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-frontend, namespace: taskboard}
spec:
  replicas: 2
  selector: {matchLabels: {app: taskboard-frontend}}
  template:
    metadata: {labels: {app: taskboard-frontend}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: ghcr.io/example/taskboard-frontend:latest
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: taskboard-frontend, namespace: taskboard}
spec:
  selector: {app: taskboard-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
