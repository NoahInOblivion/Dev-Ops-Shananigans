apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  namespace: taskboard
data:
  DATABASE_URL: postgresql+psycopg://taskboard:change-me@postgres:5432/taskboard
---
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db
  namespace: taskboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-backend
  namespace: taskboard
spec:
  replicas: 2
  selector: {matchLabels: {app: taskboard-backend}}
  template:
    metadata: {labels: {app: taskboard-backend}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: ghcr.io/example/taskboard-backend:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: taskboard-config}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels: {app: taskboard-backend}
spec:
  selector: {app: taskboard-backend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskboard-backend
  namespace: taskboard
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: taskboard-backend}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
